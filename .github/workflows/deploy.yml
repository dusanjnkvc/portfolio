name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Type-check and build for the repository URL
        shell: bash
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_PUBLIC_EMAIL: ${{ vars.PUBLIC_EMAIL }}
          VITE_LOGEN_URL: ${{ vars.LOGEN_URL }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          if [[ "${repo,,}" == "${owner,,}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repo}/"
          fi
          site_url="${PAGES_BASE_URL%/}/"
          BASE_PATH="$base_path" SITE_URL="$site_url" npm run build
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

